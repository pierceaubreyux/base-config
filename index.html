<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Configurator - 3D Miniature Base Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        #info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 16px;
            border-radius: 8px;
            color: #60a5fa;
            font-size: 11px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(96, 165, 250, 0.3);
            z-index: 10;
        }

        #info-overlay .title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        #info-overlay .item {
            color: #999;
            margin: 2px 0;
        }

        #loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            border-radius: 8px;
            color: #60a5fa;
            font-size: 14px;
            border: 1px solid rgba(96, 165, 250, 0.3);
            z-index: 100;
            display: none;
        }

        #loading-overlay.visible {
            display: block;
        }

        #control-panel {
            width: 340px;
            background: #0d0d0d;
            border-left: 1px solid #1a1a1a;
            overflow-y: auto;
            padding: 24px 20px;
            color: #fff;
        }

        h1 {
            font-size: 20px;
            font-weight: bold;
            color: #60a5fa;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 10px;
            font-weight: bold;
            color: #60a5fa;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        button {
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
        }

        button:hover {
            background: #2a2a2a;
        }

        button.active {
            background: #60a5fa;
            border-color: #60a5fa;
            color: #000;
            font-weight: bold;
        }

        button.prop-btn {
            color: #60a5fa;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #60a5fa;
        }

        .prop-category {
            margin-bottom: 16px;
        }

        .prop-category-title {
            font-size: 9px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prop-variant-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .variant-btn {
            padding: 8px 4px;
            font-size: 9px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #60a5fa;
        }

        .variant-btn:hover {
            background: #2a2a2a;
            border-color: #60a5fa;
        }

        .prop-list {
            max-height: 180px;
            overflow-y: auto;
        }

        .prop-item {
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        .prop-item.selected {
            background: #1a2a3a;
            border-color: #60a5fa;
        }

        .prop-item button {
            padding: 3px 6px;
            font-size: 9px;
        }

        .prop-select {
            flex: 1;
            text-align: left;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
        }

        .prop-item.selected .prop-select {
            color: #60a5fa;
        }

        .delete-btn {
            background: #ef4444 !important;
            color: #fff !important;
        }

        .move-controls {
            margin-top: 12px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            border: 1px solid #2a2a2a;
        }

        .move-title {
            font-size: 9px;
            color: #60a5fa;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .move-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .move-btn {
            padding: 6px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #888;
            font-size: 9px;
        }

        .export-btn {
            width: 100%;
            padding: 14px;
            background: #60a5fa;
            border: none;
            color: #000;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }

        .export-btn:hover {
            background: #4a8fd8;
            transform: translateY(-2px);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container">
            <div id="info-overlay">
                <div class="title">CONTROLS</div>
                <div class="item">Click + Drag: Rotate Camera</div>
                <div class="item">Scroll: Zoom In/Out</div>
            </div>
            <div id="loading-overlay">
                <div>Loading 3D models...</div>
            </div>
        </div>
        <div id="control-panel">
            <h1>BASE BUILDER</h1>

            <div class="section">
                <div class="section-title">SHAPE</div>
                <div class="button-grid" id="shape-buttons"></div>
            </div>

            <div class="section">
                <div class="section-title">SIZE: <span id="size-value">3.0</span></div>
                <input type="range" id="size-slider" min="1.5" max="5" step="0.5" value="3">
            </div>

            <div class="section">
                <div class="section-title">MATERIAL</div>
                <div class="button-grid" id="material-buttons"></div>
            </div>

            <div class="section">
                <div class="section-title">ADD PROPS</div>
                
                <!-- Rocks with variants -->
                <div class="prop-category">
                    <div class="prop-category-title">Rocks (Real Models)</div>
                    <div class="prop-variant-grid">
                        <button class="variant-btn" onclick="addProp('rock', 'rock1.glb')">Rock 1</button>
                        <button class="variant-btn" onclick="addProp('rock', 'rock2.glb')">Rock 2</button>
                        <button class="variant-btn" onclick="addProp('rock', 'rock3.glb')">Rock 3</button>
                    </div>
                </div>

                <!-- Procedural props -->
                <div class="prop-category">
                    <div class="prop-category-title">Procedural (Placeholder)</div>
                    <div class="button-grid">
                        <button class="prop-btn" onclick="addProp('pillar', null)">+ Pillar</button>
                        <button class="prop-btn" onclick="addProp('crystal', null)">+ Crystal</button>
                        <button class="prop-btn" onclick="addProp('skull', null)">+ Skull</button>
                    </div>
                </div>
            </div>

            <div class="section" id="props-section" style="display: none;">
                <div class="section-title">PROPS (<span id="prop-count">0</span>)</div>
                <div class="prop-list" id="prop-list"></div>
                <div class="move-controls" id="move-controls" style="display: none;">
                    <div class="move-title">MOVE SELECTED</div>
                    <div class="move-grid">
                        <button class="move-btn" onclick="moveProp('x', -1)">← X</button>
                        <button class="move-btn" onclick="moveProp('y', 1)">↑ Y</button>
                        <button class="move-btn" onclick="moveProp('x', 1)">X →</button>
                        <button class="move-btn" onclick="moveProp('z', -1)">↑ Z</button>
                        <button class="move-btn" onclick="moveProp('y', -1)">↓ Y</button>
                        <button class="move-btn" onclick="moveProp('z', 1)">Z ↓</button>
                    </div>
                    
                    <div style="margin-top: 12px;">
                        <div class="move-title">SCALE: <span id="scale-value">1.0</span>x</div>
                        <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1" style="width: 100%;">
                    </div>
                    
                    <div style="margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                        <button class="move-btn" onclick="rotateProp(-1)">↶ Rotate</button>
                        <button class="move-btn" onclick="rotateProp(1)">Rotate ↷</button>
                    </div>
                </div>
            </div>

            <button class="export-btn" onclick="exportSTL()">Export STL</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Global state
        let scene, camera, renderer;
        let baseMesh = null;
        let props = [];
        let selectedProp = null;
        let mouseDown = false;
        let mousePos = { x: 0, y: 0 };
        let loader = new GLTFLoader();
        let loadedModels = {}; // Cache for loaded models

        // Configuration
        let baseShape = 'cylinder';
        let baseTexture = 'stone';
        let baseSize = 3;

        const shapes = ['cylinder', 'square', 'hexagon', 'octagon'];
        const materials = {
            stone: { color: 0x8b8680, roughness: 0.9, metalness: 0.1 },
            wood: { color: 0x8b6f47, roughness: 0.95, metalness: 0.0 },
            metal: { color: 0x9ca3af, roughness: 0.3, metalness: 0.8 },
            marble: { color: 0xf8f9fa, roughness: 0.2, metalness: 0.1 },
            obsidian: { color: 0x1a1a1a, roughness: 0.4, metalness: 0.6 }
        };

        // Initialize
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 10, 30);

            // Camera
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 6, 8);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 10, 5);
            mainLight.castShadow = true;
            mainLight.shadow.camera.near = 0.1;
            mainLight.shadow.camera.far = 50;
            mainLight.shadow.camera.left = -10;
            mainLight.shadow.camera.right = 10;
            mainLight.shadow.camera.top = 10;
            mainLight.shadow.camera.bottom = -10;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);

            const rimLight = new THREE.DirectionalLight(0x4a90e2, 0.3);
            rimLight.position.set(-5, 3, -5);
            scene.add(rimLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x0d0d0d,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid
            const gridHelper = new THREE.GridHelper(20, 40, 0x1a1a1a, 0x1a1a1a);
            scene.add(gridHelper);

            // Mouse controls
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('wheel', onWheel, { passive: false });

            // Resize
            window.addEventListener('resize', onResize);

            // Create UI
            createUI();

            // Create initial base
            updateBase();

            // Preload GLB models
            preloadModels();

            // Animate
            animate();
        }

        function createUI() {
            // Shape buttons
            const shapeContainer = document.getElementById('shape-buttons');
            shapes.forEach(shape => {
                const btn = document.createElement('button');
                btn.textContent = shape;
                btn.className = shape === baseShape ? 'active' : '';
                btn.onclick = () => selectShape(shape);
                shapeContainer.appendChild(btn);
            });

            // Material buttons
            const materialContainer = document.getElementById('material-buttons');
            Object.keys(materials).forEach(mat => {
                const btn = document.createElement('button');
                btn.textContent = mat;
                btn.className = mat === baseTexture ? 'active' : '';
                btn.onclick = () => selectMaterial(mat);
                materialContainer.appendChild(btn);
            });

            // Size slider
            const slider = document.getElementById('size-slider');
            slider.addEventListener('input', (e) => {
                baseSize = parseFloat(e.target.value);
                document.getElementById('size-value').textContent = baseSize.toFixed(1);
                updateBase();
            });
        }

        function preloadModels() {
            const modelPaths = ['rock1.glb', 'rock2.glb', 'rock3.glb'];
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.add('visible');
            
            let loadedCount = 0;
            
            modelPaths.forEach(path => {
                loader.load(
                    `assets/${path}`,
                    (gltf) => {
                        loadedModels[path] = gltf.scene;
                        loadedCount++;
                        
                        // Enable shadows on loaded models
                        gltf.scene.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        
                        if (loadedCount === modelPaths.length) {
                            loadingOverlay.classList.remove('visible');
                            console.log('All models loaded successfully!');
                        }
                    },
                    (progress) => {
                        console.log(`Loading ${path}: ${(progress.loaded / progress.total * 100).toFixed(0)}%`);
                    },
                    (error) => {
                        console.error(`Error loading ${path}:`, error);
                        loadedCount++;
                        if (loadedCount === modelPaths.length) {
                            loadingOverlay.classList.remove('visible');
                        }
                    }
                );
            });
        }

        function selectShape(shape) {
            baseShape = shape;
            updateBase();
            updateButtonStates('shape-buttons', shape);
        }

        function selectMaterial(mat) {
            baseTexture = mat;
            updateBase();
            updateButtonStates('material-buttons', mat);
        }

        function updateButtonStates(containerId, activeValue) {
            const buttons = document.getElementById(containerId).querySelectorAll('button');
            buttons.forEach(btn => {
                btn.className = btn.textContent === activeValue ? 'active' : '';
            });
        }

        function updateBase() {
            if (baseMesh) {
                scene.remove(baseMesh);
                baseMesh.geometry.dispose();
                baseMesh.material.dispose();
            }

            let geometry;
            const height = 0.5;

            switch (baseShape) {
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(baseSize, baseSize, height, 32);
                    break;
                case 'square':
                    geometry = new THREE.BoxGeometry(baseSize * 2, height, baseSize * 2);
                    break;
                case 'hexagon':
                    geometry = new THREE.CylinderGeometry(baseSize, baseSize, height, 6);
                    break;
                case 'octagon':
                    geometry = new THREE.CylinderGeometry(baseSize, baseSize, height, 8);
                    break;
            }

            const matProps = materials[baseTexture];
            const material = new THREE.MeshStandardMaterial({
                color: matProps.color,
                roughness: matProps.roughness,
                metalness: matProps.metalness
            });

            baseMesh = new THREE.Mesh(geometry, material);
            baseMesh.position.y = height / 2;
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            scene.add(baseMesh);
        }

        window.addProp = function(propType, modelFile) {
            const id = Date.now() + Math.random(); // Ensure unique ID

            if (modelFile && loadedModels[modelFile]) {
                // Use loaded GLB model
                const model = loadedModels[modelFile].clone();
                
                // Position the model
                model.position.set(
                    (Math.random() - 0.5) * baseSize * 1.5,
                    0.5, // Start at base level
                    (Math.random() - 0.5) * baseSize * 1.5
                );
                
                // Scale to reasonable size (adjust as needed)
                const scale = 0.5;
                model.scale.set(scale, scale, scale);
                
                model.userData = { id, type: propType, modelFile };
                
                scene.add(model);
                props.push(model);
                
            } else {
                // Fallback to procedural geometry
                let geometry, material;

                switch (propType) {
                    case 'pillar':
                        geometry = new THREE.CylinderGeometry(0.15, 0.18, 1.5, 8);
                        material = new THREE.MeshStandardMaterial({ 
                            color: 0xd4d4d4, 
                            roughness: 0.7 
                        });
                        break;
                    case 'crystal':
                        geometry = new THREE.ConeGeometry(0.3, 1.2, 6);
                        material = new THREE.MeshStandardMaterial({ 
                            color: 0x60a5fa,
                            roughness: 0.1,
                            metalness: 0.5,
                            transparent: true,
                            opacity: 0.8
                        });
                        break;
                    case 'skull':
                        geometry = new THREE.SphereGeometry(0.25, 16, 16);
                        material = new THREE.MeshStandardMaterial({ 
                            color: 0xe8e4d9, 
                            roughness: 0.9 
                        });
                        break;
                    default:
                        geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                        material = new THREE.MeshStandardMaterial({ color: 0x888888 });
                }

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(
                    (Math.random() - 0.5) * baseSize * 1.5,
                    propType === 'pillar' ? 1.25 : 0.75,
                    (Math.random() - 0.5) * baseSize * 1.5
                );
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = { id, type: propType };

                scene.add(mesh);
                props.push(mesh);
            }

            updatePropList();
        }

        function updatePropList() {
            const list = document.getElementById('prop-list');
            const section = document.getElementById('props-section');
            const count = document.getElementById('prop-count');

            if (props.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            count.textContent = props.length;
            list.innerHTML = '';

            props.forEach(prop => {
                const item = document.createElement('div');
                item.className = 'prop-item' + (selectedProp === prop ? ' selected' : '');

                const selectBtn = document.createElement('button');
                const displayName = prop.userData.modelFile 
                    ? prop.userData.modelFile.replace('.glb', '').toUpperCase()
                    : prop.userData.type.toUpperCase();
                selectBtn.textContent = displayName;
                selectBtn.className = 'prop-select';
                selectBtn.onclick = () => selectPropById(prop.userData.id);

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'DEL';
                deleteBtn.className = 'delete-btn';
                deleteBtn.onclick = () => removeProp(prop.userData.id);

                item.appendChild(selectBtn);
                item.appendChild(deleteBtn);
                list.appendChild(item);
            });

            const moveControls = document.getElementById('move-controls');
            moveControls.style.display = selectedProp ? 'block' : 'none';
            
            // Update scale slider when prop is selected
            if (selectedProp) {
                const scaleSlider = document.getElementById('scale-slider');
                const currentScale = selectedProp.scale.x; // Assuming uniform scale
                scaleSlider.value = currentScale;
                document.getElementById('scale-value').textContent = currentScale.toFixed(1);
                
                // Add event listener for scale changes
                scaleSlider.oninput = (e) => {
                    const newScale = parseFloat(e.target.value);
                    if (selectedProp) {
                        selectedProp.scale.set(newScale, newScale, newScale);
                        document.getElementById('scale-value').textContent = newScale.toFixed(1);
                    }
                };
            }
        }

        function selectPropById(id) {
            selectedProp = props.find(p => p.userData.id === id);
            updatePropList();
        }

        function removeProp(id) {
            const index = props.findIndex(p => p.userData.id === id);
            if (index !== -1) {
                const prop = props[index];
                scene.remove(prop);
                
                // Dispose geometry and materials
                prop.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry?.dispose();
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.dispose());
                        } else {
                            child.material?.dispose();
                        }
                    }
                });
                
                props.splice(index, 1);
                
                if (selectedProp?.userData.id === id) {
                    selectedProp = null;
                }
                
                updatePropList();
            }
        }

        window.moveProp = function(axis, direction) {
            if (!selectedProp) return;
            const step = 0.2;
            if (axis === 'x') selectedProp.position.x += direction * step;
            if (axis === 'y') selectedProp.position.y += direction * step;
            if (axis === 'z') selectedProp.position.z += direction * step;
        }

        window.rotateProp = function(direction) {
            if (!selectedProp) return;
            const step = Math.PI / 8; // 22.5 degrees
            selectedProp.rotation.y += direction * step;
        }

        window.exportSTL = function() {
            alert('STL export requires the three-stdlib library. For a full implementation, you would:\n\n1. Import STLExporter from three-stdlib\n2. Export the scene geometry\n3. Create a download link\n\nThis is a prototype demonstrating the UI and 3D functionality.');
        }

        // Mouse controls
        function onMouseDown(e) {
            mouseDown = true;
            mousePos = { x: e.clientX, y: e.clientY };
        }

        function onMouseMove(e) {
            if (!mouseDown) return;
            
            const deltaX = e.clientX - mousePos.x;
            const deltaY = e.clientY - mousePos.y;
            const rotationSpeed = 0.005;
            
            const angle = deltaX * rotationSpeed;
            const currentPos = camera.position;
            const distance = Math.sqrt(currentPos.x ** 2 + currentPos.z ** 2);
            
            const currentAngle = Math.atan2(currentPos.z, currentPos.x);
            const newAngle = currentAngle + angle;
            
            camera.position.x = distance * Math.cos(newAngle);
            camera.position.z = distance * Math.sin(newAngle);
            camera.position.y = Math.max(2, Math.min(15, camera.position.y - deltaY * 0.02));
            
            camera.lookAt(0, 0, 0);
            mousePos = { x: e.clientX, y: e.clientY };
        }

        function onMouseUp() {
            mouseDown = false;
        }

        function onWheel(e) {
            e.preventDefault();
            const zoomSpeed = 0.002;
            const currentDistance = camera.position.length();
            const newDistance = Math.max(3, Math.min(20, currentDistance + e.deltaY * zoomSpeed));
            
            camera.position.multiplyScalar(newDistance / currentDistance);
            camera.lookAt(0, 0, 0);
        }

        function onResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Start the app
        init();
    </script>
</body>
</html>
